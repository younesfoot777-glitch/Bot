<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الأمان</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #17212b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <h3 id="status">جاري فحص الأمان وشبكة الاتصال...</h3>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function checkSecurity() {
            try {
                // جلب الـ IP ومعلومات الشبكة ونوع الاتصال (وكشف الـ VPN/Proxy إن أمكن)
                let response = await fetch('https://ipapi.co/json/');
                let data = await response.json();
                
                let userIp = data.ip;
                // فحص مبدئي إذا كانت الشبكة معروفة بأنها داتا سنتر أو بروكسي/VPN
                let isProxyOrVpn = false;
                
                // بعض الشبكات المعروفة للـ VPN يمكن كشفها عبر الorg أو type
                let org = (data.org || "").toLowerCase();
                if (org.includes('vpn') || org.includes('proxy') || org.includes('hosting') || org.includes('datacenter') || org.includes('cloudflare') || org.includes('digitalocean')) {
                    isProxyOrVpn = true;
                }

                // إرسال الـ IP ونتيجة فحص الـ VPN للبوت
                tg.sendData(JSON.stringify({ 
                    ip: userIp, 
                    is_vpn: isProxyOrVpn 
                }));

            } catch (e) {
                // حل بديل لو الخدمة الأولى علقت، نجيب الـ IP بطريقة سريعة بديلة
                try {
                    let fallbackRes = await fetch('https://api.ipify.org?format=json');
                    let fallbackData = await fallbackRes.json();
                    tg.sendData(JSON.stringify({ ip: fallbackData.ip, is_vpn: false }));
                } catch (err) {
                    tg.sendData(JSON.stringify({ ip: "unknown", is_vpn: false }));
                }
            }

            setTimeout(() => { tg.close(); }, 500);
        }

        window.onload = checkSecurity;
    </script>
</body>
</html>
