<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الأمان</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #17212b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #242f3d;
            border-top: 4px solid #64b5ef;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3 id="status">جاري التحقق من الحساب...</h3>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // تنفيذ فوري بدون تعليق
        setTimeout(() => {
            try {
                const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
                if (user && user.id) {
                    // إرسال الـ Telegram ID الحقيقي للبوت فوراً
                    tg.sendData(JSON.stringify({ user_id: user.id }));
                    document.getElementById('status').innerText = "تم التحقق بنجاح!";
                } else {
                    // لو الـ User ID مش متاح، نبعت معرف افتراضي لمنع التوقف
                    tg.sendData(JSON.stringify({ user_id: "guest_" + Math.random() }));
                    document.getElementById('status').innerText = "تم التحقق!";
                }
            } catch (e) {
                tg.sendData(JSON.stringify({ user_id: "error" }));
            }

            // إغلاق النافذة خلال نصف ثانية تلقائياً
            setTimeout(() => {
                tg.close();
            }, 400);
        }, 300);
    </script>
</body>
</html>
