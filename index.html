<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الجهاز</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #17212b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #242f3d;
            border-top: 4px solid #64b5ef;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3 id="status">جاري قراءة بصمة الجهاز...</h3>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function getPermanentDeviceId() {
            // البحث عن البصمة الدائمة في ذاكرة الجهاز
            let deviceId = localStorage.getItem('unique_device_token');
            
            // إذا لم تكن موجودة (أول مرة يفتح البوت من الموبايل)، يتم إنشاؤها وتثبيتها
            if (!deviceId) {
                deviceId = 'DEV-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('unique_device_token', deviceId);
            }
            return deviceId;
        }

        setTimeout(() => {
            const finalDeviceId = getPermanentDeviceId();
            // إرسال البصمة الثابتة للبوت
            tg.sendData(JSON.stringify({ device_id: finalDeviceId }));
            document.getElementById('status').innerText = "تم التحقق، جاري إغلاق النافذة...";
            setTimeout(() => { tg.close(); }, 400);
        }, 500);
    </script>
</body>
</html>
