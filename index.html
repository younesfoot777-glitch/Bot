<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الجهاز</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #17212b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #242f3d;
            border-top: 4px solid #64b5ef;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3 id="status">جاري التحقق من جهازك...</h3>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function getDeviceId() {
            const nav = window.navigator;
            const screen = window.screen;
            let rawData = [
                nav.userAgent,
                nav.language,
                screen.colorDepth,
                screen.width + 'x' + screen.height,
                nav.hardwareConcurrency || 1,
                new Date().getTimezoneOffset()
            ].join('||');

            let hash = 0;
            for (let i = 0; i < rawData.length; i++) {
                let char = rawData.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }
            return 'FP-' + Math.abs(hash);
        }

        setTimeout(() => {
            const deviceId = getDeviceId();
            // إرسال البيانات رسمياً عبر قنوات تليجرام WebApp الداخلية
            tg.sendData(JSON.stringify({ device_id: deviceId }));
            document.getElementById('status').innerText = "تم التحقق، جاري إغلاق النافذة...";
            setTimeout(() => { tg.close(); }, 500);
        }, 600);
    </script>
</body>
</html>
