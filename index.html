<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الجهاز</title>
    <style>
        body {
            background-color: #17212b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #242f3d;
            border-top: 4px solid #64b5ef;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3 id="status">جاري التحقق من جهازك...</h3>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');
        const botToken = "8635624434:AAE2rRgRIdmzTL0HTo9y6GwUtmeHRVrh4Fc";

        function getDeviceId() {
            const nav = window.navigator;
            const screen = window.screen;
            let rawData = [
                nav.userAgent,
                nav.language,
                screen.colorDepth,
                screen.width + 'x' + screen.height,
                nav.hardwareConcurrency || 1,
                new Date().getTimezoneOffset()
            ].join('||');

            let hash = 0;
            for (let i = 0; i < rawData.length; i++) {
                let char = rawData.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }
            return 'FP-' + Math.abs(hash);
        }

        async function verifyDevice() {
            if (!chatId) {
                document.getElementById('status').innerText = "يرجى فتح الصفحة من داخل البوت حصراً.";
                return;
            }

            const deviceId = getDeviceId();

            try {
                // إرسال كود التحقق والبصمة للبوت عبر Telegram API
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=/verify_${deviceId}`);
                
                document.getElementById('status').innerText = "تم إرسال بصمة الجهاز بنجاح! ارجع للمحادثة.";
                setTimeout(() => {
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.close();
                    }
                }, 1000);
            } catch(e) {
                document.getElementById('status').innerText = "حدث خطأ في الاتصال.";
            }
        }

        window.onload = verifyDevice;
    </script>
</body>
</html>
