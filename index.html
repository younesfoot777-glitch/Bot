<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #17212b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>
    <h3>جاري تأكيد الاتصال...</h3>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // إرسال إشارة فورية للبوت بدون أي fetch خوارزمي
        setTimeout(() => {
            tg.sendData(JSON.stringify({ action: "verify" }));
            setTimeout(() => { tg.close(); }, 200);
        }, 100);
    </script>
</body>
</html>
